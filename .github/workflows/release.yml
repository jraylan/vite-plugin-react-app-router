name: Release

# Runs on every push to main (release-please opens/updates the release PR and,
# once it is merged, cuts the release and publishes). It can also be started
# by hand from the Actions tab: by default that behaves exactly like a push;
# tick `publish` to force publishing the version in package.json, e.g. to
# retry a publish that failed after the GitHub release was already created.
#
# npm trusted publishing is bound to this file name (release.yml): the
# `npm publish --provenance` step must stay here.
on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            publish:
                description: "Publish the version in package.json to npm even if release-please creates no release in this run"
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Bun installs and builds (the project's lockfile is bun.lock).
            # Node/npm stay only for `npm pack` and `npm publish --provenance`.
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            # release-please only hands us a tag when it created the release in
            # this run; a forced manual publish derives it from package.json.
            - name: Resolve release tag
              id: tag
              run: |
                  TAG="${{ needs.release-please.outputs.tag_name }}"
                  if [ -z "$TAG" ]; then
                      TAG="v$(node -p "require('./package.json').version")"
                  fi
                  echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

            - name: Create tarball package
              id: pack
              run: |
                  FILENAME=$(npm pack | tail -n 1)
                  echo "filename=$FILENAME" >> $GITHUB_OUTPUT

            - name: Publish to npm with provenance
              run: npm publish   ${{ steps.pack.outputs.filename }} --access public
                  --provenance

            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@v2
              id: attestation
              with:
                  subject-path: " ${{ steps.pack.outputs.filename }}"

            - name: Add provenance to release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.tag.outputs.tag_name }}
                  files: " ${{ steps.pack.outputs.filename }}"
                  append_body: true
                  body: |
                      ---
                      [Provenance attestations](${{ steps.attestation.outputs.attestation-url }})
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
